[project]
name = "ai-rag-production"
version = "0.1.0"
description = "Production-style Retrieval-Augmented Generation service with reranking, OCR, and CI/CD"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.0",
    "en-core-web-sm",
    "faiss-cpu>=1.14.3",
    "fastapi>=0.139.0",
    "langchain-openai>=1.3.5",
    "langchain-text-splitters>=1.1.2",
    "langsmith>=0.10.5",
    "numpy>=2.5.1",
    "openai>=2.45.0",
    "pillow>=12.3.0",
    "pinecone>=9.1.0",
    "presidio-analyzer>=2.2.362",
    "presidio-anonymizer>=2.2.363",
    "pydantic-settings>=2.14.2",
    "pymupdf>=1.28.0",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "ragas==0.2.15",
    "requests>=2.34.2",
    "sentence-transformers>=5.6.0",
    "streamlit>=1.59.2",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "black>=26.5.1",
    "flake8>=7.3.0",
    "httpx>=0.28.1",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
